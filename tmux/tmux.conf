# ---- General ----
# Start window & pane numbering at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on            # close a window → others renumber, no gaps
set -g mouse on                 # trackpad/wheel scroll enters copy mode
set -sg escape-time 10          # don't delay Esc (important for Vim inside tmux)
set -g history-limit 50000      # bigger scrollback history

# ---- Copy mode: Vim style ----
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
# Forward modified keys like Shift+Enter (Kitty keyboard protocol / CSI-u)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ---- Status line (the bar at the bottom) ----
set -g status on
set -g status-interval 5                 # redraw the bar every 5s (clock etc.)
set -g status-position bottom            # put it at the bottom (use 'top' if you prefer)
set -g status-justify left               # window list grows from the left

# Base colors for the whole bar
set -g status-style "bg=#1c1c1c,fg=#808080"

# Left side: session name in a green block
set -g status-left-length 30
set -g status-left "#[bg=#3a3a3a,fg=#00d75f,bold] #S #[default] "

# Right side: date + time
set -g status-right-length 60
set -g status-right "#[fg=#808080] %a %d %b #[fg=#00d75f,bold]%H:%M "

# Inactive windows: gray, with a separator block between them
set -g window-status-separator "#[fg=#444444]│"
set -g window-status-format "#[fg=#808080] #I:#W#{?window_flags,#F,} "

# Active window: green, bold, slightly raised background block
set -g window-status-current-format "#[bg=#00875f,fg=#ffffff,bold] #I:#W#{?window_flags,#F,} "

# Windows with activity / bells stand out
set -g window-status-activity-style "fg=#ffaf00"

# Pane borders match the theme (active border green)
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#00875f"

set -g @plugin 'tmux-plugins/tpm'              # tpm manages itself too
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.config/tmux/resurrect'   # keep session saves under ~/.config/tmux
set -g @continuum-restore 'on'   # auto-restore the last saved session on startup

run '~/.config/tmux/plugins/tpm/tpm'   # MUST be the last line

